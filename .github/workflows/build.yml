# Gera os instaladores do Windows (NSIS) e do Linux (AppImage e .deb) e publica nas Releases.
# Dispara ao enviar uma tag "v*" (ex.: v0.3.0) ou à mão pela aba Actions (Run workflow). Nos dois casos publica:
# o primeiro job cria a tag e a Release v<versão do package.json> se ainda não existirem, e os instaladores sobem nela.
# O electron-updater dos apps instalados lê o latest.yml (Windows) e o latest-linux.yml (AppImage) desta release.
name: Instaladores

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  testes:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npm run check
      # O GitHub só publica Release com tag existente: cria a tag v<versão> no commit atual, se ainda não houver.
      # E cria a Release aqui, antes dos instaladores: o electron-builder sobe vários arquivos ao mesmo tempo e,
      # sem Release, cada envio criava a sua (saíam duas Releases com a mesma tag, cada uma com parte dos arquivos).
      - name: Tag e Release da versão
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          v="v$(node -p "require('./package.json').version")"
          if git ls-remote --exit-code --tags origin "refs/tags/$v" >/dev/null; then
            echo "A tag $v já existe."
          else
            git tag "$v" && git push origin "$v"
          fi
          if gh release view "$v" >/dev/null 2>&1; then
            echo "A Release $v já existe."
          else
            gh release create "$v" --title "$v" --notes "Novidades no cartão do app. Baixe o .exe (Windows) ou o .AppImage/.deb (Linux) abaixo."
          fi

  windows:
    needs: testes
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npx electron-builder --win nsis --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: dist/*.exe

  linux:
    # Depois do Windows: os dois publicam na mesma Release e não podem tentar criá-la ao mesmo tempo.
    needs: windows
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --no-audit --no-fund
      - run: npx electron-builder --linux AppImage deb --publish always
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v4
        with:
          name: linux
          path: |
            dist/*.AppImage
            dist/*.deb
